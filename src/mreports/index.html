<!DOCTYPE html>
<html lang="en">
<head>
<!--@@CONFIG@@-->
<meta name="build" content="@@BUILD@@">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mreports</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#6b7280;--bd:#d9dde3;--ac:#1f6feb;--err:#b42318}
  @media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--fg:#e8eaee;--mut:#9aa3b2;--bd:#323944;--ac:#4c8dff;--err:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 14px}
  main{max-width:520px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 18px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  input,select,button{width:100%;font:inherit;padding:9px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
  button{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer;margin-top:14px}
  button.sec{background:transparent;color:var(--fg);border-color:var(--bd)}
  button:disabled{opacity:.55;cursor:default}
  #msg{font-size:13px;min-height:20px;margin-top:8px}
  #msg.err{color:var(--err)}
  .hide{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;overflow:auto;padding:16px 10px}
  .modal .box{background:var(--card);border:1px solid var(--bd);border-radius:10px;max-width:560px;margin:0 auto;padding:16px}
  .modal fieldset{border:1px solid var(--bd);border-radius:8px;margin:0 0 12px;padding:6px 12px 12px}
  .modal legend{font-weight:600;font-size:13px;padding:0 6px}
  .modal input.miss{border-color:var(--err)}
  .modal .note{font-size:12px;color:var(--mut)}
  .modal .err{color:var(--err);font-size:13px;min-height:18px;margin-top:6px}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{border-bottom:1px solid var(--bd);padding:5px 4px;text-align:left}.tbl button{width:auto;margin:0 2px;padding:3px 8px;font-size:12px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mut)}.chk input{width:auto}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .row.top button{margin:0 0 14px}
  html.emb{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#6b7280;--bd:#d9dde3;--ac:#1f6feb;--err:#b42318}
  html.emb #loginCard,html.emb #outBtn{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Mreports</h1>
  <p class="sub">Fund applications, vouchers, registers and dockets</p>

  <div class="card" id="loginCard">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="loginBtn">Sign in &amp; load data</button>
  </div>

    <div class="row top">
      <button class="sec" id="reloadBtn">Reload data</button>
      <button class="sec" id="outBtn">Sign out</button>
    </div>
    <label for="fDoc" style="margin-top:0">Document</label>
    <select id="fDoc">
      <option value="fa">Fund Application (VA-2, VA-2A, VA-6A)</option>
      <option value="cir">Cheque Issue Register</option>
      <option value="vch">Vouchers (VA-6)</option>
      <option value="f61">Form 61 (schedule docket)</option>
      <option value="cb">Cash Book (monthly, by scheme)</option>
      <option value="faix">Form FA.IX</option>
      <option value="lop">LOP (schedule docket)</option>
      <option value="wr">Work Register (per estimate)</option>
      <option value="so">S.O Register (sanction orders)</option>
      <option value="ben">Beneficiary Report (bank particulars)</option>
      <option value="vssres">VSS Resolution (from fund application)</option>
    </select>
    <div class="row">
      <div id="dScheme"><label for="fScheme">Scheme</label><select id="fScheme"></select></div>
      <div id="dBatch"><label for="fBatch">Batch No</label><select id="fBatch"></select></div>
    </div>
    <div class="row hide" id="dSo">
      <div><label for="fSoYear">Year</label><select id="fSoYear"></select></div>
      <div><label for="fSoType">Type of S.O.</label><select id="fSoType"><option value="">All</option><option>DSO</option><option>RSO</option><option>CSO</option></select></div>
    </div>
    <div id="dBen" class="hide"><label for="fBen">Beneficiary</label><select id="fBen"></select>
      <label class="chk"><input type="checkbox" id="fBenReview"> Review / edit details before generating</label></div>
    <div id="dCb" class="hide"><div class="row"><div><label for="fCbVss">VSS</label><select id="fCbVss"></select></div><div><label for="fCbMonth">Month</label><select id="fCbMonth"></select></div></div></div>
    <div id="dVssRes" class="hide"><label for="fMeet">VSS meeting</label><select id="fMeet"></select>
      <div class="row"><div><label for="fLang">Language</label><select id="fLang"><option value="both">English + Telugu</option><option value="en">English</option><option value="te">Telugu</option></select></div></div>
      <button class="sec" id="meetBtn" type="button">Manage VSS meetings (add / edit / delete)</button></div>
    <div id="dDocket" class="hide"><label for="fDocket">Docket (scheme / month)</label><select id="fDocket" size="6"></select></div>
    <div id="dFaDate" class="hide"><label for="fFaDate">Fund application date</label><select id="fFaDate"></select></div>
    <div id="dEsti"><label for="fEsti">Estimate</label>
    <select id="fEsti"></select></div>
    <button id="genBtn">Generate PDF</button>
  </div>
  <div id="msg"></div>
  <p class="sub" style="margin-top:14px">Build @@BUILD@@</p>
</main>
<div id="meetModal" class="modal hide"><div class="box" id="meetBox"></div></div>
<div id="benModal" class="modal hide"><div class="box" id="benBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

/* ============================ CONFIG ============================ */

const CFG = window.APP_CONFIG || {};
const SB_URL = CFG.supabaseUrl || "https://ewnrcnfyiulrjritaeam.supabase.co";
const SB_KEY = CFG.anonKey || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3bnJjbmZ5aXVscmpyaXRhZWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxOTEwMDYsImV4cCI6MjEwNzc2NzAwNn0.rbJNPpBgS4k2uKxM9Igk6S7rN_FL3gZcoJu-8jkgeD8";
const CONFIG = {

      closing: "పై తెలిపిన పనులకు నిధులు (మొత్తం రూ. {total}/-) మంజూరు చేయవలసినదిగా కోరడమైనది.",
      members: "సభ్యులు:", h_no: "క్ర.సం.", h_name: "పేరు", h_desig: "హోదా", h_sign: "సంతకం", chairman: "ఛైర్మన్",
    },
  },

  // Beneficiary report: values used when nothing is stored for a field (all editable on the manual screen)
  ben_table: "withdrawal_accounts",   // bank accounts: wa_id, bank, branch, place, account_no, ifsc_code, name_of_account, ...
  ben_defaults: { a2: "M. Pattabhi, Forest Range Officer (FAC), Social Forestry Range, Chittoor", a3: "-", email: "-", code: "-", state: "Andhra Pradesh" },
  countersign_block: ["Divisional Forest Officer", "Social Forestry", "Chittoor."],
};
const PAGE_W = 612, PAGE_H = 792, INCH = 72;

/* ============================ SUPABASE ============================ */
let creds = null, token = null, DATA = null;
// Inside the main app (a frame of it) this page reuses the app's signed-in connection; opened on its own it shows its own sign-in.
const HOST = (window.parent !== window && window.parent.__MREPORTS__) ? window.parent.__MREPORTS__ : null;
if (HOST) document.documentElement.classList.add("emb");

async function login() {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(creds),
  });
  const js = await r.json().catch(() => null);
  if (!r.ok || !js || !js.access_token) { token = null; throw new Error("Login failed: the email address or password is incorrect."); }
  token = js.access_token;
}

async function getRowsRest(table, order) {
  const PAGE = 1000, rows = [];
  let offset = 0, retried = false;
  for (;;) {
    if (!token) await login();
    const q = new URLSearchParams({ select: "*", limit: PAGE, offset });
    if (order.length) q.set("order", order.map(o => o + ".asc").join(","));
    const r = await fetch(`${SB_URL}/rest/v1/${table}?${q}`, { headers: { apikey: SB_KEY, Authorization: "Bearer " + token } });
    if (r.status === 401 && !retried) { token = null; retried = true; continue; }
    if (r.status === 404) throw new Error(`Table '${table}' was not found in Supabase.`);
    if (r.status === 401 || r.status === 403) throw new Error(`Not allowed to read '${table}' (check this user's permissions).`);
    const js = await r.json().catch(() => null);
    if (!r.ok || !Array.isArray(js)) throw new Error(`Reading '${table}' failed: ${(js && js.message) || r.status}`);
    rows.push(...js);
    if (js.length < PAGE) return rows;
    offset += PAGE;
  }
}

async function getRowsHost(table, order) {
  const SB = HOST.sb(), rows = []; let from = 0;
  for (;;) {
    let q = SB.from(table).select("*");
    (order || []).forEach(o => { q = q.order(o, { ascending: true }); });
    const { data, error } = await q.range(from, from + 999);
    if (error) {
      const c = String(error.code || "");
      if (c === "42P01" || /not find the table|does not exist/i.test(error.message || "")) throw new Error(`Table '${table}' was not found in Supabase.`);
      if (c === "42501" || /permission|denied|not allowed/i.test(error.message || "")) throw new Error(`Not allowed to read '${table}' (check this user's permissions).`);
      throw new Error(`Reading '${table}' failed: ${error.message}`);
    }
    rows.push(...data);
    if (data.length < 1000) return rows;
    from += 1000;
  }
}
const getRows = (t, o) => HOST ? getRowsHost(t, o) : getRowsRest(t, o);
// Bank particulars live in a Supabase table of their own. The database's table list (PostgREST schema) is searched for a table that has an
// IFSC / account-number column; if the schema is not readable, a few likely names are tried. CONFIG.ben_table names the table outright.
const APP_TABLES = new Set(["voucher_details", "estimate", "esti_task", "advance", "fund_application", "withdrawn_details", "voucher_settings", "expenditure"]);
async function fetchTableColumns() {
  try {
    let url = SB_URL, key = SB_KEY, tok = token;
    if (HOST) { const sb = HOST.sb(); url = sb.supabaseUrl || url; key = sb.supabaseKey || key; const { data } = await sb.auth.getSession(); tok = (data && data.session && data.session.access_token) || tok; }
    else if (!tok) { await login(); tok = token; }
    const r = await fetch(`${url}/rest/v1/`, { headers: { apikey: key, Authorization: "Bearer " + tok } });
    if (!r.ok) return null;
    const js = await r.json(), defs = js.definitions || (js.components && js.components.schemas) || {};
    return Object.fromEntries(Object.entries(defs).map(([t, d]) => [t, Object.keys((d && d.properties) || {})]));
  } catch (e) { return null; }
}
async function loadBeneficiaryRows(lenient) {
  let names = CONFIG.ben_table ? [CONFIG.ben_table] : [];
  if (!names.length) {
    const schema = await fetchTableColumns();
    if (schema) names = Object.entries(schema).filter(([t, cols]) => !APP_TABLES.has(t) && (cols.some(k => /ifsc/i.test(k)) || (cols.some(k => /acc(ou)?nt|^ac_?no/i.test(k)) && cols.some(k => /bank|name/i.test(k))))).map(([t]) => t);
  }
  if (!names.length) names = ["beneficiary", "beneficiaries", "payee", "payees", "bank_details", "bank_accounts", "vss_bank"];
  const got = await Promise.all(names.map(async t => ({ t, rows: await lenient(t, []) })));
  return [got.flatMap(g => g.rows), got.filter(g => g.rows.length).map(g => g.t)];
}
async function loadData() {
  const lenient = (t, o) => getRows(t, o).catch(() => []);
  const [vd, estimate, tasks, adv, faRows, wd, settings, expRows] = await Promise.all([
    getRows("voucher_details", ["vch_id"]),
    getRows("estimate", ["est_id"]),
    getRows("esti_task", ["task_esti_no", "est_slno"]),
    getRows("advance", ["tid"]),
    getRows("fund_application", ["fa_id"]),
    lenient("withdrawn_details", ["wd_id"]),
    lenient("voucher_settings", ["id"]),
    lenient("expenditure", ["eid"]),
  ]);
  // normalise types (same rules as supabase_source.py: id/n/p -> number, d -> date)
  vd.forEach(r => {
    ["vch_id", "task_no", "voucher_amount", "qnty", "page_from", "page_to"].forEach(k => r[k] = num(r[k]));
    ["voucher_date", "work_from_date", "work_to_date", "measurement_date"].forEach(k => r[k] = pdate(r[k]));
  });
  estimate.forEach(r => { r.est_date = pdate(r.est_date); });
  adv.forEach(r => { r.amount = num(r.amount); r.dt = pdate(r.dt); r.credited_date = pdate(r.credited_date); r.credited_amt = num(r.credited_amt); });
  const est = {};
  estimate.forEach(r => { est[r.esti_no] = r; });
  const taskLookup = {};
  tasks.forEach(r => (taskLookup[r.task_esti_no] = taskLookup[r.task_esti_no] || []).push(r));
  assignBatches(vd, adv, est);
  expRows.forEach(r => { r.dt = pdate(r.dt); });
  const data = { vd, est, taskLookup, adv, exp: expRows };
  // Bank particulars of beneficiaries, if the database has such a table (several likely names tried; missing ones are ignored)
  [data.ben, data.ben_tables] = await loadBeneficiaryRows(lenient);
  data.meet = [];
  data.batchTokens = buildBatchTokens(adv);
  data.faCases = buildFundCases(faRows, wd, settings, data);
  data.vssOf = estiNo => lookupVss(wd, settings, estiNo);   // VSS name of an estimate (used by Form 61)
  return data;
}

/* ============================ HELPERS ============================ */
const num = v => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v);
const pdate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s ?? "")); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
const p2 = n => String(n).padStart(2, "0");
const fmtDate = t => { if (t == null) return ""; const d = new Date(t); return `${p2(d.getUTCDate())}/${p2(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`; };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const isBlank = v => v === null || v === undefined;

const ONES = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
const two = n => n < 20 ? ONES[n] : (TENS[Math.floor(n / 10)] + (n % 10 ? " " + ONES[n % 10] : "")).trim();
const three = n => n >= 100 ? ONES[Math.floor(n / 100)] + " Hundred" + (n % 100 ? " & " + two(n % 100) : "") : two(n);
function wordsIndian(n) {
  n = Math.round(n); if (n === 0) return "Zero";
  const parts = [], crore = Math.floor(n / 1e7); n %= 1e7;
  const lakh = Math.floor(n / 1e5); n %= 1e5;
  const th = Math.floor(n / 1e3); n %= 1e3;
  if (crore) parts.push(three(crore) + " Crore");
  if (lakh) parts.push(three(lakh) + " Lakh");
  if (th) parts.push(three(th) + " Thousand");
  if (n) parts.push(three(n));
  return parts.join(" ");
}
function indianComma(n) {
  n = Math.trunc(n); const neg = n < 0; let s = String(Math.abs(n)), res;
  if (s.length <= 3) res = s;
  else { const last3 = s.slice(-3); let rest = s.slice(0, -3); const parts = [];
    while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
    if (rest) parts.unshift(rest); res = parts.join(",") + "," + last3; }
  return neg ? "-" + res : res;
}
const fmtAmount = n => (n == null || isNaN(n)) ? "" : `${indianComma(n)}-00`;
function fmtRate(r) {
  if (r == null) return ""; r = Math.round(r * 1000) / 1000;
  if (Math.abs(r - Math.round(r)) < 1e-9) return String(Math.round(r));
  return r.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
}
function fmtQty(q, unit) {
  if (unit && unit.trim().toLowerCase() === "ha") return `${q.toFixed(1)} ${unit}`;
  if (Number.isInteger(q)) return `${q} ${unit}`.trim();
  return `${q} ${unit}`.trim();
}
function parseEstiNo(e) {
  const m = /^\s*(DSO|RSO)\s*(\d+)\s*\/\s*(\d{4})\s*-\s*(\d{4})/.exec(String(e));
  if (!m) return ["So No.", String(e), ""];
  return [m[1] === "DSO" ? "D.So No." : "R.So No.", m[2], `${m[3]}-${m[4].slice(2)}`];
}
const normText = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const schemeDisplay = s => CONFIG.scheme_display_map[s] ?? s;

/* difflib.SequenceMatcher(None, a, b).ratio() — used to guess a task's unit */
function seqRatio(a, b) {
  const T = a.length + b.length; if (T === 0) return 1;
  let M = 0; const stack = [[0, a.length, 0, b.length]];
  while (stack.length) {
    const [alo, ahi, blo, bhi] = stack.pop();
    let bi = alo, bj = blo, bk = 0, prev = new Array(bhi - blo + 1).fill(0);
    for (let i = alo; i < ahi; i++) {
      const cur = new Array(bhi - blo + 1).fill(0);
      for (let j = blo; j < bhi; j++) if (a[i] === b[j]) {
        const k = prev[j - blo] + 1; cur[j - blo + 1] = k;
        if (k > bk) { bk = k; bi = i - k + 1; bj = j - k + 1; }
      }
      prev = cur;
    }
    if (bk) { M += bk; stack.push([alo, bi, blo, bj], [bi + bk, ahi, bj + bk, bhi]); }
  }
  return 2 * M / T;
}
function findUnit(lookup, estiNo, text) {
  const grp = lookup[estiNo]; if (!grp) return "";
  const target = normText(text); let bestR = 0, bestU = "";
  for (const row of grp) {
    const t = normText(row.task); if (!t) continue;
    let r = seqRatio(target, t);
    if (target && (t.includes(target) || target.includes(t))) r = Math.max(r, 0.9);
    if (r > bestR) { bestR = r; bestU = isBlank(row.unit) ? "" : String(row.unit); }
  }
  return bestR >= 0.55 ? bestU : "";
}

// Unit and "per" (rate basis) of a task: best-matching row of the estimate's task list (same matching as findUnit)
function findTaskUnitPer(lookup, estiNo, text) {
  const grp = (lookup || {})[estiNo]; if (!grp) return { unit: "", per: "" };
  const target = normText(text); let bestR = 0, best = null;
  for (const row of grp) {
    const t = normText(row.task); if (!t) continue;
    let r = seqRatio(target, t);
    if (target && (t.includes(target) || target.includes(t))) r = Math.max(r, 0.9);
    if (r > bestR) { bestR = r; best = row; }
  }
  if (!best || bestR < 0.55) return { unit: "", per: "" };
  // Task-table values can be messy ("2 times", "1 time", "566.28" in the unit column): keep only the unit word, and a positive numeric per
  let unit = isBlank(best.unit) ? "" : String(best.unit).trim().replace(/^[\d.,\s]+/, "").trim();
  if (!unit) {   // unit missing / purely numeric: infer from the work description
    const dsc = String(text ?? "").toLowerCase();
    unit = /\bbeds?\b/.test(dsc) ? "Beds" : /\bdays?\b/.test(dsc) ? "Days" : "";
  }
  if (unit) unit = unit[0].toUpperCase() + unit.slice(1);
  const pn = parseFloat(String(best.per ?? "").replace(/,/g, ""));
  return { unit, per: pn > 0 ? String(Number(pn.toFixed(3))) : "" };
}

/* ============================ BATCH ASSIGNMENT ============================ */
// A batch = one Advance Token (fund release) for an estimate; vouchers are walked in
// date order and a batch closes when the running total reaches (or passes) the token amount.
const cmpNull = (a, b) => (a == null) - (b == null) || (a < b ? -1 : a > b ? 1 : 0);
function assignBatches(vd, adv, est) {
  vd.forEach(r => {
    r.scheme_disp = est[r.esti_no] ? schemeDisplay(String(est[r.esti_no].scheme ?? "").trim()) : "";
    r.batch_no = null;
  });
  const byEsti = {}; vd.forEach(r => (byEsti[r.esti_no] = byEsti[r.esti_no] || []).push(r));
  for (const [estiNo, grp] of Object.entries(byEsti)) {
    const tokens = adv.filter(a => a.trans_id === estiNo).sort((a, b) => cmpNull(a.dt, b.dt));
    const ordered = [...grp].sort((a, b) => cmpNull(a.voucher_date, b.voucher_date) || cmpNull(a.vch_id, b.vch_id));
    let ti = 0, sum = 0, pending = [];
    for (const r of ordered) {
      pending.push(r); sum += r.voucher_amount || 0;
      if (ti < tokens.length) {
        const target = tokens[ti].amount;
        if (Math.abs(sum - target) < 0.5 || sum > target) { pending.forEach(p => p.batch_no = ti + 1); pending = []; sum = 0; ti++; }
      }
    }
    if (pending.length) pending.forEach(p => p.batch_no = ti + 1);
  }
}

function buildBatchTokens(adv) {
  const by = {}; adv.forEach(a => (by[a.trans_id] = by[a.trans_id] || []).push(a));
  const out = [];
  Object.keys(by).sort().forEach(esti => by[esti].slice().sort((a, b) => cmpNull(a.dt, b.dt))
    .forEach((a, i) => out.push({ esti_no: esti, batch_no: i + 1, token_no: a.token_no, amount: a.amount, date: a.dt })));
  return out;
}

/* ============================ PDF CANVAS SHIM ============================ */
// Mimics the bits of reportlab's canvas the layout code uses (origin bottom-left, points).
const FONTS = { "Helvetica": ["helvetica", "normal"], "Helvetica-Bold": ["helvetica", "bold"], "Helvetica-BoldOblique": ["helvetica", "bolditalic"], "Times-Roman": ["times", "normal"], "Helvetica-Oblique": ["helvetica", "italic"], "Times-Bold": ["times", "bold"] };

  page() { this.d.setLineWidth(1); this.d.setDrawColor(0); this.d.setTextColor(0); }
  newPage() { this.d.addPage("letter", this.land ? "landscape" : "portrait"); this.page(); }
  setFont(f, s) { this.font = [f, s]; const [n, st] = FONTS[f]; this.d.setFont(n, st); this.d.setFontSize(s); }
  stringWidth(t, f, s) { const [cf, cs] = this.font; const [n, st] = FONTS[f]; this.d.setFont(n, st); this.d.setFontSize(s); const w = this.d.getTextWidth(String(t)); this.setFont(cf, cs); return w; }
  drawString(x, y, t) { this.d.text(String(t), x, this.H - y); }
  drawRightString(x, y, t) { this.d.text(String(t), x, this.H - y, { align: "right" }); }

const sw = (c, t, f, s) => c.stringWidth(t, f, s);

    if (cur) { lines.push(cur); cur = ""; }
    if (sw(c, w, font, size) <= maxW) { cur = w; continue; }
    let chunk = "";                       // a single word wider than the column: break it by characters
    for (const ch of w) { if (chunk && sw(c, chunk + ch, font, size) > maxW) { lines.push(chunk); chunk = ch; } else chunk += ch; }
    cur = chunk;

}
// wrap that may also break after "/" (e.g. rates like 12.5/nos)
const wrapCell = (c, text, font, size, maxW) => wrapText(c, String(text).replace(/\//g, "/ "), font, size, maxW).map(l => l.replace(/\/ /g, "/"));

function generateVouchers(data, { scheme, batch, esti }) {
  let rows = data.vd.slice();
  if (scheme) rows = rows.filter(r => r.scheme_disp.toLowerCase() === scheme.toLowerCase());
  if (batch) rows = rows.filter(r => r.batch_no === Number(batch));
  if (esti) rows = rows.filter(r => r.esti_no === esti);
  const vno = r => { const n = Number(r.voucher_no); return isNaN(n) ? Infinity : n; };
  rows.sort((a, b) => cmpNull(a.esti_no, b.esti_no) || (vno(a) - vno(b) || 0) || cmpNull(a.vch_id, b.vch_id));
  if (!rows.length) return null;
  const c = new Canvas();
  rows.forEach((r, i) => {
    if (i) c.newPage();
    const v = prepareVoucher(r, data.est, data.taskLookup);
    if (r.batch_no != null) v.batch_no = p2(r.batch_no);
    drawVoucherPage(c, v);
  });
  return { doc: c.d, count: rows.length };
}

/* ============================ CHEQUE ISSUE REGISTER ============================ */
const CIR_TITLE = "CHEQUE ISSUE REGISTER", CIR_SUBTITLE = `${CONFIG.division} — Advance / Token Issues`;
const CIR_COLS = [["Sl.\nNo.", 0.4], ["Date", 0.75], ["Token No.", 1.1], ["Esti_no", 1.4], ["Scheme", 1.3], ["Amount", 1.1]];
const CIR_HEADER_H = 26, CIR_ROW_H = 16, CIR_SUB_H = 16, CIR_BOTTOM = 0.6 * INCH;

function monthTotals(entries) {
  const m = new Map();
  entries.forEach(e => { const k = monthKey(e.date); m.set(k, (m.get(k) || 0) + e.amount); });
  return [...m.entries()].sort((a, b) => (a[0] === null) - (b[0] === null) || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
}

  const tot = CIR_COLS.reduce((a, c) => a + c[1], 0), scale = (right - left) / (tot * INCH), xs = [left];
  CIR_COLS.forEach(c => xs.push(xs[xs.length - 1] + c[1] * INCH * scale));
  return xs;
}
const centersOf = xs => xs.slice(0, -1).map((x, i) => (x + xs[i + 1]) / 2);
function cirPageHeader(c, pageNo, monthLbl) {
  const left = 0.6 * INCH, right = PAGE_W - 0.6 * INCH, top = PAGE_H - 0.5 * INCH;
  c.setFont("Helvetica-Bold", 8); c.drawRightString(right, top, `Page ${pageNo}`);
  c.setFont("Helvetica-Bold", 16); c.drawCentredString(PAGE_W / 2, top - 4, CIR_TITLE);
  c.setFont("Helvetica", 9); c.drawCentredString(PAGE_W / 2, top - 20, CIR_SUBTITLE);
  let y = top - 40;
  if (monthLbl) { c.setFont("Helvetica-BoldOblique", 9); c.drawString(left, y, `(continued — ${monthLbl})`); y -= 14; }
  return [y, left, right];
}
function cirTableHeader(c, top, xs) {
  c.setLineWidth(1); c.line(xs[0], top, xs[xs.length - 1], top);
  c.setFont("Helvetica-Bold", 8.5);
  centersOf(xs).forEach((cx, i) => CIR_COLS[i][0].split("\n").forEach((ln, j) => c.drawCentredString(cx, top - 11 - j * 9, ln)));
  const hb = top - CIR_HEADER_H; c.line(xs[0], hb, xs[xs.length - 1], hb);
  xs.forEach(x => c.line(x, hb, x, top));
  return hb;
}
function cirRowBox(c, y, xs, h) { c.line(xs[0], y - h, xs[xs.length - 1], y - h); xs.forEach(x => c.line(x, y - h, x, y)); return y - h; }
function cirRow(c, y, xs, sl, e) {
  const cx = centersOf(xs); c.setFont("Helvetica", 8.5);
  [String(sl), fmtDate(e.date), String(e.token_no ?? ""), String(e.esti_no ?? ""), String(e.scheme), fmtAmount(e.amount)]
    .forEach((t, i) => c.drawCentredString(cx[i], y - 11, t));
  return cirRowBox(c, y, xs, CIR_ROW_H);
}
function cirTotalRow(c, y, xs, label, amount, size) {
  c.setFont("Helvetica-Bold", size); c.drawString(xs[1] + 3, y - 11, label);
  c.drawCentredString(centersOf(xs)[5], y - 11, fmtAmount(amount));

}
function cirBody(c, entries, pg, subtitle) {
  const newPage = monthLbl => {
    pg.n++; const [y0, left, right] = cirPageHeader(c, pg.n, monthLbl), xs = cirGeometry(left, right);
    if (subtitle && !monthLbl) { c.setFont("Helvetica-BoldOblique", 9.5); c.drawString(left, y0 + 2, subtitle); }
    return [cirTableHeader(c, y0, xs), xs];
  };
  let [y, xs] = newPage();
  const grand = entries.reduce((a, e) => a + e.amount, 0);
  let sl = 1, cur, started = false, run = 0;
  const flush = () => {
    if (y - CIR_SUB_H < CIR_BOTTOM) { c.newPage(); [y, xs] = newPage(monthLabel(cur)); }
    y = cirTotalRow(c, y, xs, `Total for ${monthLabel(cur)}`, run, 8.5);
  };
  for (const e of entries) {
    const m = monthKey(e.date);
    if (started && m !== cur) { flush(); run = 0; }
    if (y - CIR_ROW_H < CIR_BOTTOM) { c.newPage(); [y, xs] = newPage(monthLabel(m)); }
    y = cirRow(c, y, xs, sl++, e); run += e.amount; cur = m; started = true;
  }
  if (started) flush();
  if (y - CIR_SUB_H < CIR_BOTTOM) { c.newPage(); [y, xs] = newPage(); }
  cirTotalRow(c, y, xs, "GRAND TOTAL", grand, 9);
}
function cirSummary(c, pg, schemeTotals, months, grand, title) {
  c.newPage(); pg.n++;

function soParse(e) {

function drawFA2(c, cs) {
  const left = FA_MARGIN, right = PAGE_W - FA_MARGIN; let y = PAGE_H - 0.5 * INCH;
  c.setFont("Helvetica", 9.5); c.drawRightString(right, y, `Scheme: ${cs.scheme}`);
  y -= 26; c.setFont("Times-Roman", 12); c.drawCentredString(PAGE_W / 2, y, "Watch Register for recommending advances to VSS (VA – 2A)");
  y -= 24; let x = drawField(c, "Division", CONFIG.division, left, y, left + 1.55 * INCH);
  x = drawField(c, "Range", CONFIG.range, x + 22, y, x + 22 + 1.5 * INCH); drawField(c, "Section", CONFIG.section, x + 22, y, right);

  const top = y - 16, bottom = 2.55 * INCH, hh = 52, [xs, widths, cx] = faGeometry(FA_WR_COLS, left, right);
  const workW = widths[2] - 8, bodyH = top - hh - bottom, totH = 20;
  // Each record (the work, then every item) is ONE ruled row; text wraps inside its cell, the row grows to fit,
  // and all values in the row are centred vertically so the data lines up.
  let fs = WR_MAX, rows, total;
  for (;;) {
    const LH = fs * 1.25, mk = (cells, amt) => { const n = Math.max(1, ...cells.map(x => x.length)); return { cells, amt, n, h: n * LH + 7 }; };
    rows = [];
    const soL = wrapText(c, `${cs.so_label.replace(".So No.", "SO ")}${cs.so_num}`, "Helvetica", fs, widths[1] - 4); if (cs.so_year) soL.push(cs.so_year);
    rows.push({ ...mk([wrapText(c, cs.vss_short, "Helvetica", fs, widths[0] - 6), soL, wrapText(c, cs.name_of_work, "Helvetica", fs, workW)]), main: true });
    cs.items.forEach(it => {   // task description, then its quantity, rate and amount on the next line
      const nstr = n => String(Number(Number(n).toFixed(3))), hasQ = it.qnty != null && it.qnty !== 0, unit = hasQ ? (it.unit || "") : "", perTxt = (it.rate > 0 && it.unit) ? ` per ${it.per || "1"} ${it.unit}` : "",
        segs = [it.qnty != null ? `Qty: ${nstr(it.qnty)}${unit ? " " + unit : ""}` : "", it.rate != null ? `Rate: Rs. ${nstr(it.rate)}${perTxt}` : "", `Amount: Rs. ${fmtAmount(it.amount)}`].filter(Boolean);
      const detL = []; segs.forEach(sg => { const last = detL[detL.length - 1]; if (last !== undefined && sw(c, last + "  |  " + sg, "Helvetica", fs) <= workW) detL[detL.length - 1] = last + "  |  " + sg; else detL.push(sg); });   // Qty | Rate | Amount, never split mid-item
      rows.push(mk([[], [], [...wrapText(c, `(${it.sl_no}) ${it.description}`, "Helvetica", fs, workW), ...detL]], it.amount));
    });
    total = rows.reduce((a, r) => a + r.h, 0);
    if (total <= bodyH - totH || fs <= WR_PG) break;
    fs = Math.max(WR_PG, Math.round((fs - 0.2) * 10) / 10);
  }
  const LH = fs * 1.25, bt = top - hh, tb = bottom + totH;
  // Split the rows over as many pages as needed (a work with many items does not fit on one page at a readable size).
  // Every page repeats the heading and column titles; the Total and signatures go on the last page only.
  const pages = [[]]; let used = 0;
  rows.forEach(r => { if (used + r.h > bodyH && pages[pages.length - 1].length) { pages.push([]); used = 0; } pages[pages.length - 1].push(r); used += r.h; });
  const lastH = pages[pages.length - 1].reduce((a, r) => a + r.h, 0);
  if (lastH > bodyH - totH && pages[pages.length - 1].length > 1) { const mv = pages[pages.length - 1].pop(); pages.push([mv]); }
  const block = (ls, align, x, mid) => { const t = mid + (ls.length * LH) / 2 - LH * 0.78; ls.forEach((ln, i) => align === "c" ? c.drawCentredString(x, t - i * LH, ln) : c.drawString(x, t - i * LH, ln)); };
  pages.forEach((pr, pi) => {
    const isLast = pi === pages.length - 1;
    if (pi) {   // continuation page: repeat the heading
      c.newPage(); c.setFont("Helvetica", 9.5); c.drawRightString(right, PAGE_H - 0.5 * INCH, `Scheme: ${cs.scheme}`);
      let yy = PAGE_H - 0.5 * INCH - 26; c.setFont("Times-Roman", 12); c.drawCentredString(PAGE_W / 2, yy, "Watch Register for recommending advances to VSS (VA – 2A) - Contd.");
      yy -= 24; let xx = drawField(c, "Division", CONFIG.division, left, yy, left + 1.55 * INCH);
      xx = drawField(c, "Range", CONFIG.range, xx + 22, yy, xx + 22 + 1.5 * INCH); drawField(c, "Section", CONFIG.section, xx + 22, yy, right);
    }
    c.setLineWidth(1); c.rect(xs[0], bottom, xs[xs.length - 1] - xs[0], top - bottom);
    xs.slice(1, -1).forEach(x => c.line(x, bottom, x, top));
    c.line(xs[0], bt, xs[xs.length - 1], bt); faHeader(c, FA_WR_COLS, xs, cx, top, hh);
    if (isLast) c.line(xs[0], tb, xs[xs.length - 1], tb);
    let ry = bt;
    pr.forEach((r, i) => {
      const mid = ry - r.h / 2, vy = mid - fs * 0.35; ry -= r.h;
      c.setFont("Helvetica", fs);
      if (r.main) { block(r.cells[0], "c", cx[0], mid); block(r.cells[1], "c", cx[1], mid); }
      block(r.cells[2], "l", xs[2] + 4, mid);
      if (r.main) { c.drawCentredString(cx[3], vy, faMoney(cs.sanctioned)); c.drawCentredString(cx[4], vy, faMoney(cs.spent_prev)); }
      else c.drawCentredString(cx[5], vy, fmtAmount(r.amt));
      if (ry > (isLast ? tb : bottom) + 0.5 && i < pr.length - 1) c.line(xs[0], ry, xs[xs.length - 1], ry);
    });
    if (isLast) {
      const ty = bottom + totH / 2 - 3; c.setFont("Helvetica-Bold", Math.max(fs + 0.2, WR_PG));
      c.drawCentredString(cx[4], ty, "Total"); c.drawCentredString(cx[5], ty, fmtAmount(cs.total));
      faSignatures(c, bottom - 26, left, right, cs);
    } else { c.setFont("Helvetica-Oblique", 8); c.drawRightString(right - 4, bottom - 12, "Contd. on next page"); }
  });
}

function drawFA3(c, cs) {

    y -= 18; c.setFont("Helvetica", 10); c.drawString(lx, y, l); c.drawString(lx + 1.55 * INCH, y, ":"); c.drawString(rx, y, rl); c.drawString(vx - 10, y, ":");

  c.drawString(vx + 0.9 * INCH, y, "Page No."); c.drawString(vx + 1.7 * INCH, y, "-");

  y -= 34; c.setFont("Helvetica", 10); let seg = "RECEIVED From"; c.drawString(left, y, seg);
  let x = left + sw(c, seg + " ", "Helvetica", 10); dotted(c, x, y - 2, right); c.setFont("Helvetica", 9.5); c.drawString(x + 3, y, FA.received_from);
  y -= 24; c.setFont("Helvetica", 10); seg = "The sum of (Rs."; c.drawString(left, y, seg); x = left + sw(c, seg + " ", "Helvetica", 10);
  const amt = `${indianComma(cs.total)}/-`; c.setFont("Helvetica", 9.5); c.drawString(x + 3, y, amt);
  x += Math.max(1.05 * INCH, sw(c, amt, "Helvetica", 9.5) + 12); c.setFont("Helvetica", 10);
  seg = ") Rupees"; c.drawString(x, y, seg); x += sw(c, seg + " ", "Helvetica", 10);
  const wl = wrapText(c, `${cs.total_words} only`, "Helvetica", 9.5, right - x);
  dotted(c, x, y - 2, right); c.setFont("Helvetica", 9.5); c.drawString(x + 3, y, wl[0]);
  wl.slice(1).forEach(ex => { y -= 16; dotted(c, left, y - 2, right); c.drawString(left + 3, y, ex); });

  y -= 26; c.setFont("Helvetica", 10); seg = "Name of the works or purpose for which payment is made."; c.drawString(left, y, seg);
  x = left + sw(c, seg + " ", "Helvetica", 10); c.setFont("Helvetica", 9.5);
  const pl = wrapText(c, `for ${cs.name_of_work}`, "Helvetica", 9.5, right - x); c.drawString(x + 3, y, pl[0]);
  const rest = pl.slice(1).join(" ");
  if (rest) wrapText(c, rest, "Helvetica", 9.5, right - left).forEach(ln => { y -= 16; c.drawString(left, y, ln); });
  y -= 70; c.setFont("Helvetica", 10); c.drawString(left, y, "Date"); c.drawString(left + 0.75 * INCH, y, ":"); c.drawString(left, y - 20, "Witness:");
  c.setFont("Helvetica", 9); c.drawCentredString(right - 1.3 * INCH, y - 11, "Signature of Payee");
}

function generateFA(data, { esti, batch, date }) {
  let cases = data.faCases;
  if (esti) cases = cases.filter(k => String(k.esti_no).trim() === esti.trim());
  if (batch) cases = cases.filter(k => k.batch_no === Number(batch));
  if (date) cases = cases.filter(k => k.application_date === Number(date));
  if (!cases.length) return null;
  const c = new Canvas();
  cases.forEach((cs, i) => { if (i) c.newPage(); drawFA1(c, cs); c.newPage(); drawFA2(c, cs); c.newPage(); drawFA3(c, cs); });
  return { doc: c.d, count: cases.length };
}

/* ============================ VSS MEETINGS (register) + VSS RESOLUTION ============================ */
const meetKey = m => m.meeting_id;
function faLinks(v) {   // linked fund applications: [{esti_no, batch_no}]
  if (typeof v === "string") { try { v = JSON.parse(v); } catch { v = []; } }
  return Array.isArray(v) ? v.filter(x => x && x.esti_no != null && x.batch_no != null).map(x => ({ esti_no: String(x.esti_no).trim(), batch_no: Number(x.batch_no) })) : [];
}
const faKey = k => `${String(k.esti_no).trim()}|${Number(k.batch_no)}`;
function meetNormalise(r) {
  let mem = r.members; if (typeof mem === "string") { try { mem = JSON.parse(mem); } catch { mem = []; } }
  return { ...r, meeting_dt: pdate(r.meeting_dt), resolution_dt: pdate(r.resolution_dt), resolution_amt: num(r.resolution_amt), resolution_passed: r.resolution_passed === true || r.resolution_passed === "true",
    members: Array.isArray(mem) ? mem.filter(x => x && (x.name || x.designation)) : [], fund_applications: faLinks(r.fund_applications) };
}
async function loadMeetings() {
  try { DATA.meet = (await getRows("vss_meetings", ["meeting_dt"])).map(meetNormalise); DATA.meetErr = ""; }
  catch (e) { DATA.meet = []; DATA.meetErr = e.message; }
  fillMeetSelect();
}
const meetLabel = m => `${fmtDate(m.meeting_dt)} — ${m.vss_id}${m.scheme ? " — " + m.scheme : ""}${m.resolution_no ? " — Res. " + m.resolution_no : ""}${m.fund_applications.length ? " — " + m.fund_applications.length + " application" + (m.fund_applications.length > 1 ? "s" : "") : ""}`;
function fillMeetSelect(keep) {
  const sel = $("fMeet"), old = keep ?? sel.value, list = (DATA && DATA.meet ? DATA.meet : []).slice().sort((a, b) => (b.meeting_dt || 0) - (a.meeting_dt || 0));
  sel.innerHTML = `<option value="">${list.length ? "Select a meeting…" : "No meetings yet — use Manage"}</option>` + list.map(m => `<option value="${m.meeting_id}">${meetLabel(m).replace(/</g, "&lt;")}</option>`).join("");
  if (old && list.some(m => String(m.meeting_id) === String(old))) sel.value = String(old);

// insert / update / delete on the vss_meetings table (works with the app's own connection or a direct sign-in)
async function sbWrite(method, table, { body, id } = {}) {
  if (HOST) {
    const SB = HOST.sb(); let q = SB.from(table), r;
    if (method === "POST") r = await q.insert(body).select();
    else if (method === "PATCH") r = await q.update(body).eq("meeting_id", id).select();
    else r = await q.delete().eq("meeting_id", id).select();
    if (r.error) throw new Error(r.error.message);
    return r.data;
  }
  for (let attempt = 0; attempt < 2; attempt++) {
    if (!token) await login();
    const r = await fetch(`${SB_URL}/rest/v1/${table}${id != null ? "?meeting_id=eq." + encodeURIComponent(id) : ""}`, {
      method, headers: { apikey: SB_KEY, Authorization: "Bearer " + token, "Content-Type": "application/json", Prefer: "return=representation" }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && !attempt) { token = null; continue; }
    const js = await r.json().catch(() => null);
    if (!r.ok) throw new Error((js && js.message) || `Request failed (${r.status})`);
    return js;
  }
}

  r.font(true, FS); r.text(left + 0.35 * INCH * k, y, `${T.scheme} : ${X.scheme}`); y -= 20 * k;

// Picks the largest scale at which the resolution still fits on one page (a dry run that only counts pages), then draws it for real.
function layoutOnePage(r, T, X) {

async function runVssResolution() {

      const rr = rasterRenderer(); layoutOnePage(rr, CONFIG.vss_res.te, { ...X, te: true });

    }

    y = wrTotals(c, y, xs, d, start, n, pAmt, pQty);
    if (part === parts) { if (y - WR_FOOT < bottom) { startPage(c); pg.n++; y = LAND_H - 0.5 * INCH; } wrAbstract(c, y - 20, left, right, d); }
  }
}
function generateWorkRegister(data, { esti }) {
  const list = esti ? [esti] : [...new Set(data.vd.map(r => r.esti_no).filter(e => !isBlank(e)))].sort();
  const c = new Canvas(true), pg = { n: 0 }; let count = 0;
  list.forEach(e => { const d = wrData(data, e); if (d.entries.length) { wrEstimate(c, d, pg); count++; } });
  return count ? { doc: c.d, count } : null;
}

/* ============================ UI ============================ */
const $ = id => document.getElementById(id);
const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
const busy = (b, ...ids) => ids.forEach(i => $(i).disabled = b);
const fill = (sel, items, all) => { sel.innerHTML = `<option value="">${all}</option>` + items.map(x => `<option>${String(x).replace(/</g, "&lt;")}</option>`).join(""); };

/* ============================ BENEFICIARY REPORT ============================ */
// "Particulars of bank accounts of the agencies" form, one page per beneficiary. Bank details come from the database where it has them,
// otherwise (or when you tick "Review / edit") from a manual screen; what you type is remembered in this browser for next time.
const BEN_FIELDS = [
  { k: "name", label: "Beneficiary Name*", req: true }, { k: "acc", label: "Beneficiary Account Number*", req: true },
  { k: "a1", label: "Beneficiary Address 1*", req: true }, { k: "a2", label: "Beneficiary Address 2*", req: true }, { k: "a3", label: "Beneficiary Address 3*" },
  { k: "mobile", label: "Beneficiary Mobile No." }, { k: "email", label: "Beneficiary E mail ID" }, { k: "code", label: "Party / Employee Code" },
  { k: "ifsc", label: "IFSC Code*", req: true }, { k: "loc", label: "Location of the Beneficiary Branch" }, { k: "bank", label: "Bank*", req: true },
  { k: "state", label: "State*", req: true }, { k: "branch", label: "Branch*", req: true },
];
const BEN_KEYS = {   // column-name patterns used to find each field in the beneficiary table / voucher rows
  acc: [/^(\w*_)?(bank_?)?acc(ou)?nt_?(no|num|number)?$/, /^(\w*_)?a(cc?|\/c)_?(no|num|number)$/, /acc(ou)?nt.*(no|num)/], ifsc: [/ifsc/], bank: [/^(\w*_)?bank(_?name)?$/], branch: [/^(\w*_)?branch(_?name)?$/],
  loc: [/^(\w*_)?(branch_?)?loc(ation)?$/, /^place$/], a1: [/^(\w*_)?addr(ess)?_?(1|one)$/, /^(\w*_)?address$/], a2: [/addr(ess)?_?2$/], a3: [/addr(ess)?_?3$/],
  mobile: [/mobile|phone|contact_?no/], email: [/e_?mail/], code: [/(party|emp(loyee)?)_?code/], state: [/^state$/],
};
const BEN_STORE = "mreports_beneficiary";
const benLoad = () => { try { return JSON.parse(localStorage.getItem(BEN_STORE) || "{}"); } catch { return {}; } };
const benSave = o => { try { localStorage.setItem(BEN_STORE, JSON.stringify(o)); } catch { /* storage unavailable */ } };
const benPick = (row, k) => {
  for (const re of BEN_KEYS[k] || []) for (const key of Object.keys(row)) {
    if (re.test(key.toLowerCase()) && !isBlank(row[key]) && String(row[key]).trim() !== "") return String(row[key]).trim();
  }
  return "";
};
const benTitle = t => String(t ?? "").toLowerCase().replace(/\b[a-z]/g, m => m.toUpperCase()).replace(/\bV\.?s\.?s\b/g, "V.S.S").replace(/\bFro\b/g, "FRO").replace(/\s+/g, " ").trim();
// One entry per bank account in the withdrawal_accounts table (nothing else is listed), oldest wa_id first.
function benAccounts(data) {
  return (data.ben || []).filter(r => benPick(r, "acc")).slice().sort((a, b) => (Number(a.wa_id) || 0) - (Number(b.wa_id) || 0));
}
// Form values for one account: bank particulars from the table; address / mobile / etc. from what was typed before (or the defaults).
function benDetails(row) {
  const nk = Object.keys(row).find(k => /^name_of_account$/i.test(k)) || Object.keys(row).find(k => /name/i.test(k) && !/bank|branch/i.test(k));
  const acc = benPick(row, "acc"), d = { ...CONFIG.ben_defaults, key: acc, name: benTitle(nk ? row[nk] : ""), auth: row.drawing_authorities || "" };
  const saved = benLoad()[normText(acc)] || {};
  Object.entries(saved).forEach(([k, v]) => { if (v) d[k] = v; });
  ["acc", "ifsc", "bank", "branch", "loc"].forEach(k => { const v = benPick(row, k); if (v) d[k] = v; });
  return d;
}
const benMissing = d => BEN_FIELDS.filter(f => f.req && !String(d[f.k] ?? "").trim());

function startBeneficiary(scheme) {
  const rows = benAccounts(DATA);   // every bank account in withdrawal_accounts
  if (!rows.length) { busy(false, "genBtn"); return msg(`No bank accounts found in table '${CONFIG.ben_table}'.`, true); }
  const one = $("fBen").value, recs = rows.map(benDetails).filter(d => !one || d.acc === one), review = $("fBenReview").checked;
  const show = recs.map(d => review || benMissing(d).length > 0);
  if (!show.some(Boolean)) return finishBeneficiary(recs);
  openBenModal(recs, show);
}
function openBenModal(recs, show) {
  const esc = v => String(v ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  const body = recs.map((d, i) => !show[i] ? "" : `<fieldset data-i="${i}"><legend>${esc(d.name)} — ${esc(d.bank)} ${esc(d.acc)}</legend>` + BEN_FIELDS.map(f =>
    `<label>${esc(f.label)}</label><input data-k="${f.k}" value="${esc(d[f.k])}" class="${f.req && !String(d[f.k] ?? "").trim() ? "miss" : ""}">`).join("") + `</fieldset>`).join("");
  $("benBox").innerHTML = `<h1 style="font-size:17px">Beneficiary details</h1><p class="note">Fields with * are mandatory. Red = not found — please enter. Optional blanks print as “-”. What you enter is remembered on this device. Bank particulars come from the withdrawal_accounts table; address and mobile are entered here.</p>${body}<div id="benErr" class="err"></div><div class="row"><button class="sec" id="benCancel">Cancel</button><button id="benOk">Generate report</button></div>`;
  $("benModal").classList.remove("hide");
  $("benCancel").onclick = () => { $("benModal").classList.add("hide"); msg(""); busy(false, "genBtn"); };
  $("benOk").onclick = () => {
    const err = [];
    document.querySelectorAll("#benBox fieldset").forEach(fs => {
      const d = recs[+fs.dataset.i];
      fs.querySelectorAll("input").forEach(inp => { d[inp.dataset.k] = inp.value.trim(); inp.classList.remove("miss"); });
      d.acc = (d.acc || "").replace(/\s+/g, ""); d.ifsc = (d.ifsc || "").replace(/\s+/g, "").toUpperCase();
      benMissing(d).forEach(f => { err.push(`${d.name}: ${f.label.replace("*", "")} is required`); fs.querySelector(`[data-k="${f.k}"]`).classList.add("miss"); });
      if (d.acc && !/^\d{6,20}$/.test(d.acc)) { err.push(`${d.name}: account number should be digits only`); fs.querySelector('[data-k="acc"]').classList.add("miss"); }
      if (d.ifsc && !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(d.ifsc)) { err.push(`${d.name}: IFSC should look like CNRB0000852`); fs.querySelector('[data-k="ifsc"]').classList.add("miss"); }
    });
    if (err.length) { $("benErr").textContent = err[0] + (err.length > 1 ? ` (+${err.length - 1} more)` : ""); return; }
    $("benModal").classList.add("hide"); finishBeneficiary(recs);
  };
}
function finishBeneficiary(recs) {
  const store = benLoad();
  recs.forEach(d => { const o = {}; BEN_FIELDS.forEach(f => { if (f.k !== "name" && d[f.k]) o[f.k] = d[f.k]; }); store[normText(d.key || d.name)] = o; });
  benSave(store);
  try {
    const out = generateBeneficiary(recs);
    out.doc.save(`beneficiary_report_${new Date().toISOString().slice(0, 10)}.pdf`);
    msg(`Done — ${out.count} beneficiary form${out.count === 1 ? "" : "s"}.`);
  } catch (e) { console.error(e); msg("Could not generate the PDF: " + e.message, true); }
  busy(false, "genBtn");
}
function generateBeneficiary(recs) {
  const c = new Canvas(), left = 0.75 * INCH, right = PAGE_W - 0.75 * INCH, W = right - left;
  const x1 = left + W * 0.40, x2 = left + W * 0.46, LH = 12.5;
  recs.forEach((d, pi) => {
    if (pi) c.newPage();
    let y = PAGE_H - 0.9 * INCH;
    c.setFont("Helvetica-Bold", 11.5);
    wrapText(c, "PARTICULARS OF BANK ACCOUNTS IN RESPECT OF THE AGENCIES TO BE OBTAINED FROM DDO'S IN THE FOLLOWING FORMAT FOR MAKING PAYMENTS THROUGH ONLINE E-CHEQUE.", "Helvetica-Bold", 11.5, W)
      .forEach((ln, i) => c.drawCentredString(PAGE_W / 2, y - i * 14, ln));
    y -= 3 * 14 + 8;
    const rows = BEN_FIELDS.map(f => ({ label: f.label, lines: wrapText(c, String(d[f.k] ?? "").trim() || "-", "Helvetica", 11, right - x2 - 14) }));
    const hs = rows.map(r => Math.max(34, r.lines.length * LH + 14)), top = y;
    // "Confirm account number" repeats the account number, so it is inserted after row 2 here
    const all = []; rows.forEach((r, i) => { all.push({ ...r, h: hs[i] }); if (BEN_FIELDS[i].k === "acc") all.push({ label: "Confirm Beneficiary Account Number*", lines: r.lines, h: hs[i] }); });
    const total = all.reduce((a, r) => a + r.h, 0), tb = top - total;
    c.setLineWidth(1); c.rect(left, tb, W, total); c.line(x1, tb, x1, top); c.line(x2, tb, x2, top);
    let ry = top;
    all.forEach((r, i) => {
      if (i) c.line(left, ry, right, ry);
      c.setFont("Helvetica", 11); c.drawString(left + 8, ry - 14, r.label); c.drawCentredString((x1 + x2) / 2, ry - 14, "::");
      c.setFont("Helvetica-Bold", 11); r.lines.forEach((ln, j) => c.drawString(x2 + 8, ry - 14 - j * LH, ln));
      ry -= r.h;
    });
    let fy = tb - 22; c.setFont("Helvetica", 10.5); c.drawString(left, fy, "*The fields are mandatory.");
    fy -= 46; const mid = left + W * 0.25, rx = right - W * 0.2;
    c.setFont("Helvetica-Bold", 10.5); CONFIG.fro_block.forEach((ln, i) => c.drawCentredString(mid, fy - i * 12, i === 0 ? ln + " (FAC)" : ln));
    const nm = String(d.name).replace(/^the\s+/i, ""), m = /chairman[\s,.\-]*(.*)$/i.exec(nm);
    const rl = m ? ["CHAIRMAN", ...(m[1] ? [m[1].toUpperCase()] : [])] : wrapText(c, nm.toUpperCase(), "Helvetica-Bold", 10.5, W * 0.4);
    rl.forEach((ln, i) => c.drawCentredString(rx, fy - i * 12, ln));
    fy -= 70; c.setFont("Helvetica-Bold", 12); c.drawCentredString(rx, fy, "COUNTER SIGNED");
    c.setFont("Helvetica-Bold", 10.5); CONFIG.countersign_block.forEach((ln, i) => c.drawCentredString(rx, fy - 46 - i * 12, ln));
  });
  return { doc: c.d, count: recs.length };
}

function refillBen() {   // one entry per bank account in withdrawal_accounts
  const rows = DATA ? benAccounts(DATA) : [], d = rows.map(benDetails);
  $("fBen").innerHTML = `<option value="">All accounts</option>` + d.map(x => `<option value="${String(x.acc).replace(/"/g, "&quot;")}">${[x.name, x.bank, x.acc].filter(Boolean).join(" — ").replace(/</g, "&lt;")}</option>`).join("");
}
function refillCb() {   // VSS and Month choices for the cash book
  if (!DATA) return;
  const names = new Set(), months = new Set();
  DATA.vd.forEach(r => { if (DATA.est[r.esti_no]) { names.add(cbVssName(DATA, r.esti_no)); const m = monthKey(r.voucher_date); if (m != null) months.add(m); } });
  DATA.adv.filter(a => a.credited === "Yes").forEach(a => { names.add(cbVssName(DATA, a.trans_id)); const m = monthKey(a.credited_date); if (m != null) months.add(m); });
  const keepV = $("fCbVss").value, keepM = $("fCbMonth").value;
  $("fCbVss").innerHTML = `<option value="">All VSS</option>` + [...names].filter(Boolean).sort().map(n => `<option>${n.replace(/</g, "&lt;")}</option>`).join("");
  $("fCbMonth").innerHTML = `<option value="">All months</option>` + [...months].sort().reverse().map(m => `<option value="${m}">${monthLabel(m)}</option>`).join("");
  $("fCbVss").value = keepV; $("fCbMonth").value = keepM;
}
function refillFilters() {
  refillCb();
  refillBen();
  const fa = $("fDoc").value === "fa", src = fa ? DATA.faCases : DATA.vd;
  fill($("fBatch"), [...new Set(src.map(r => r.batch_no).filter(b => b != null))].sort((a, b) => a - b), "All");
  fill($("fEsti"), [...new Set(src.map(r => r.esti_no))].sort(), "All");
  const dates = [...new Set(DATA.faCases.map(k => k.application_date).filter(d => d != null))].sort((a, b) => a - b);
  $("fFaDate").innerHTML = `<option value="">All</option>` + dates.map(d => `<option value="${d}">${fmtDate(d)}</option>`).join("");
  const dk = docketBuckets(DATA);
  $("fDocket").innerHTML = `<option value="">All</option>` + dk.map(b => `<option value="${docketName(b).replace(/"/g, "&quot;")}">${docketName(b).replace(/</g, "&lt;")}</option>`).join("");
  $("fDocket").selectedIndex = 0;
}
async function load() {
  busy(true, "loginBtn", "reloadBtn", "genBtn"); msg("Loading data…");
  try {
    DATA = await loadData();
    fill($("fScheme"), [...new Set([...DATA.vd.map(r => r.scheme_disp), ...DATA.adv.map(a => schemeDisplay(String(a.scheme ?? "")))].filter(Boolean))].sort(), "All");
    $("fSoYear").innerHTML = `<option value="">All</option>` + soYears(DATA).map(y => `<option>${y}</option>`).join("");
    await loadMeetings();
    refillFilters();
    $("loginCard").classList.add("hide"); $("genCard").classList.remove("hide");
    msg(`Loaded ${DATA.vd.length} vouchers.`);
  } catch (e) { msg(e.message, true); }
  busy(false, "loginBtn", "reloadBtn", "genBtn");
}

$("loginBtn").onclick = () => {
  const email = $("email").value.trim().toLowerCase(), password = $("pw").value;
  if (!email || !password) return msg("Enter your email and password.", true);
  creds = { email, password }; token = null; load();
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("reloadBtn").onclick = load;
$("meetBtn").onclick = () => { if (DATA) openMeetings(); };
$("fDoc").onchange = () => {
  const k = $("fDoc").value, dk = k === "lop" || k === "faix";
  $("dBatch").classList.toggle("hide", !(k === "vch" || k === "fa" || k === "cb")); $("dEsti").classList.toggle("hide", !(k === "vch" || k === "fa" || k === "f61" || k === "cb" || k === "wr"));
  $("dFaDate").classList.toggle("hide", k !== "fa"); $("dSo").classList.toggle("hide", k !== "so"); $("dBen").classList.toggle("hide", k !== "ben"); $("dVssRes").classList.toggle("hide", k !== "vssres"); $("dCb").classList.toggle("hide", k !== "cb");
  $("dScheme").classList.toggle("hide", !(k === "vch" || k === "cir" || k === "f61" || k === "cb" || k === "so")); $("dDocket").classList.toggle("hide", !dk);
  if (DATA) refillFilters();
};
$("outBtn").onclick = () => { creds = token = DATA = null; $("pw").value = ""; $("genCard").classList.add("hide"); $("loginCard").classList.remove("hide"); msg(""); };
$("fDoc").onchange();
if (HOST) {
  if (HOST.can()) { $("loginCard").classList.add("hide"); $("genCard").classList.remove("hide"); load(); }
  else msg("You do not have access to Reports.", true);
}
$("genBtn").onclick = () => {
  if ($("fDoc").value === "vssres") { busy(true, "genBtn"); msg("Generating…"); return runVssResolution(); }
  if ($("fDoc").value === "ben") { busy(true, "genBtn"); msg("Preparing…"); return startBeneficiary(""); }
  busy(true, "genBtn"); msg("Generating…");
  setTimeout(() => {   // let the status paint before the heavy work
    try {
      const kind = $("fDoc").value, scheme = $("fScheme").value;
      const out = kind === "cir" ? generateCIR(DATA, { scheme })
        : kind === "wr" ? generateWorkRegister(DATA, { esti: $("fEsti").value })
        : kind === "so" ? generateSORegister(DATA, { scheme, year: $("fSoYear").value, type: $("fSoType").value })
        : kind === "cb" ? generateCashbook(DATA, { scheme, esti: $("fEsti").value, batch: $("fBatch").value, vss: $("fCbVss").value, month: $("fCbMonth").value })
        : kind === "f61" ? generateForm61(DATA, { scheme, esti: $("fEsti").value })
        : kind === "lop" || kind === "faix" ? generateDocket(DATA, kind, { docket: $("fDocket").value })
        : kind === "fa" ? generateFA(DATA, { esti: $("fEsti").value, batch: $("fBatch").value, date: $("fFaDate").value })
        : generateVouchers(DATA, { scheme, batch: $("fBatch").value, esti: $("fEsti").value });
      if (out && out.error) msg(out.error, true);
      else if (!out) msg("Nothing matches those filters.", true);
      else {
        const nm = kind === "cir" ? "cheque_register" + (scheme ? "_" + scheme.replace(/\W+/g, "_") : "") : kind === "fa" ? "fund_application" : kind === "vssres" ? "vss_resolution" : kind === "lop" ? "lop" : kind === "f61" ? "form61" : kind === "cb" ? "cash_book" : kind === "so" ? "so_register" : kind === "wr" ? "work_register" : kind === "faix" ? "form_faix" : "vouchers";
        out.doc.save(`${nm}_${new Date().toISOString().slice(0, 10)}.pdf`);
        msg(`Done — ${out.count} ${kind === "cir" || kind === "so" ? "entr" + (out.count === 1 ? "y" : "ies") : kind === "fa" ? "application set(s) (3 pages each)" : kind === "vssres" ? "resolution(s)" : kind === "lop" || kind === "faix" ? "docket(s)" : kind === "f61" ? "Form 61 page(s)" : kind === "cb" ? "monthly cash book(s)" : kind === "wr" ? "estimate(s)" : "voucher page(s)"}.`);
      }
    } catch (e) { console.error(e); msg("Could not generate the PDF: " + e.message, true); }
    busy(false, "genBtn");
  }, 30);
};
