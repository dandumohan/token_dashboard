<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense & Cash Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0f2a43">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:light dark;--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--bg:#f3f5f9;--card:#fff;--ink:#0f1b2d;--mute:#5b6b7f;--line:#e2e8f0;--accent:#0f766e;--accent-ink:#fff;--accent-soft:#e3f3f0;
--err:#b42318;--hi:#c62828;--lo:#1d4ed8;--bar:#0f2a43;--shadow:0 1px 2px rgba(15,27,45,.05),0 4px 14px rgba(15,27,45,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121c2e;--ink:#e7edf6;--mute:#93a4ba;--line:#243452;--accent:#2dd4bf;--accent-ink:#042f2e;--accent-soft:#12302f;
--err:#ff8a80;--hi:#ff8a80;--lo:#8ab4ff;--bar:#0a1628;--shadow:0 1px 2px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.hide{display:none!important}

/* app bar */
.appbar{background:var(--bar);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.appbar .in{max-width:960px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.brand b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-size:11.5px;color:#9fb3c8;line-height:1.2}
.who{display:flex;align-items:center;gap:12px;font-size:13px;color:#c5d3e2}
#who{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar button.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 13px}
.appbar button.alt:hover{background:rgba(255,255,255,.12)}
main{max-width:960px;margin:0 auto;padding:20px 16px 90px}

/* sections (collapsible cards) */
section{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
section>details>summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:15px 18px 15px 44px;position:relative;cursor:pointer;list-style:none;user-select:none;font-size:16px;font-weight:650;letter-spacing:-.01em}
section>details>summary::-webkit-details-marker{display:none}
section>details>summary::before{content:"";position:absolute;left:19px;top:25px;width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-70%) rotate(-45deg);transition:transform .15s}
section>details[open]>summary::before{transform:translateY(-70%) rotate(45deg)}
section>details>summary:hover{background:var(--bg)}
section>details[open]>summary{border-bottom:1px solid var(--line)}
section>details>*:not(summary){margin-left:18px;margin-right:18px}
section>details>summary+*{margin-top:16px}
section>details>*:last-child{margin-bottom:18px}
.shead{display:flex;align-items:center;gap:10px;padding:15px 18px 15px 44px;position:relative;cursor:pointer;user-select:none;font-size:16px;font-weight:650;letter-spacing:-.01em}
.shead::before{content:"";position:absolute;left:19px;top:50%;width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-70%) rotate(-45deg);transition:transform .15s}
section.open>.shead::before{transform:translateY(-70%) rotate(45deg)}
.shead::after{content:"Add & manage entries";margin-left:auto;font-size:12px;font-weight:500;letter-spacing:0;color:var(--mute)}
section.open>.shead::after{content:"Hide entries"}
.shead:hover{background:var(--bg)}
.shead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px 6px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.sbody{padding:18px;border-top:1px solid var(--line)}
.sbody>h3:first-child{margin-top:0;padding-top:0;border-top:0}
h3{font:600 11.5px/1.3 var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-top:24px;margin-bottom:12px;padding-top:18px;border-top:1px solid var(--line)}
.stats+h3{margin-top:12px}

/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px}
label{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-bottom:5px}
input,select{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:14px var(--font)}
input[readonly]{background:var(--bg);color:var(--mute)}
input::placeholder{color:color-mix(in srgb,var(--mute) 70%,transparent)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* buttons */
button{font:600 14px var(--font);padding:9px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 1px 2px rgba(15,27,45,.14);transition:filter .12s,transform .05s,background .12s}
button:hover{filter:brightness(.93)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:550}
button.alt:hover{background:var(--bg);filter:none}
button.ghost{background:transparent;color:var(--err);padding:3px 9px;font-size:13px;font-weight:550;box-shadow:none}
button.ghost:hover{background:color-mix(in srgb,var(--err) 10%,transparent);filter:none}
button.ghost.edit{color:var(--accent)}
button.ghost.edit:hover{background:var(--accent-soft)}
.tools{margin-top:3px}
.tools button{padding:2px 6px;font-size:12px;font-weight:500;background:transparent;color:var(--mute);box-shadow:none;text-decoration:underline}

/* info lines */
.tot{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:14px;font-size:13px;font-weight:550}
.tot:empty{display:none}
#denBox .tot{margin-top:10px}
.stats .tot{margin-top:4px}

/* tables */
.wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:10px}
.wrap:has(>table:empty){display:none}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
td:first-child,td:last-child,td.n{white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* stats */
.stats{margin-bottom:4px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.chips>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12px;font-weight:500;color:var(--mute)}
.chips b{display:block;margin-top:2px;font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.chips small{display:block;margin-top:3px;font-size:11px;font-weight:400;line-height:1.35;color:var(--mute)}
.chips .hi,.chips .lo{border-left:4px solid}
.chips .hi{color:var(--hi);border-left-color:var(--hi)}.chips .hi b{color:var(--hi)}
.chips .lo{color:var(--lo);border-left-color:var(--lo)}.chips .lo b{color:var(--lo)}
.tabs{display:flex;flex-wrap:nowrap;width:fit-content;max-width:100%;overflow-x:auto;gap:3px;padding:3px;margin-bottom:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.tabs button{flex:none;white-space:nowrap;padding:5px 12px;font-size:13px;font-weight:500;background:transparent;color:var(--mute);border-radius:7px;box-shadow:none}
.tabs button:hover{filter:none;color:var(--ink)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.18)}
.br{display:grid;grid-template-columns:minmax(80px,140px) 1fr minmax(72px,104px);align-items:center;gap:10px;margin:7px 0;font-size:13px}
.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br i{display:block;height:8px;min-width:3px;border-radius:99px;background:var(--accent)}
.br b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* calculator + denominations */
.calc{max-width:340px}
.calc input{height:48px;font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.res{text-align:right;color:var(--mute);min-height:22px;margin:6px 2px 10px;font-size:13px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:12px 0;font-size:17px;font-weight:500;box-shadow:none}
.keys button.eq{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border:0;font-weight:700}
.den{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.den div{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.den span{min-width:44px;font-weight:600}
.den input{width:64px;height:32px;padding:0 8px}
.den output{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

/* browse cards */
.bcard{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.bhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px}
.bhead .sp{flex:1}
.bcard .wrap{margin-top:10px}

/* toast */
#msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;max-width:min(92vw,560px);padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--card);font-size:13.5px;font-weight:500;border-left:4px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.28)}
#msg.bad{border-left-color:var(--err)}
#msg:empty{display:none}

/* login */
#loginBox{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 420px at 50% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),var(--bg)}
.login{width:100%;max-width:400px;padding:30px 28px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 44px rgba(15,27,45,.14)}
.login .logo{width:46px;height:46px;border-radius:13px;font-size:23px}
.login h1{margin:16px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--mute)}
#lBtn{width:100%;height:42px;margin-top:2px}
#kind{max-width:340px}
#loginErr{min-height:20px;margin-top:12px;font-size:13px;color:var(--err)}

@media (min-width:700px){.grid>div:has(#eBatch){grid-column:span 2}}
@media (max-width:640px){.shead::after{content:"Entries"}section.open>.shead::after{content:"Hide"}.panel{padding:14px 14px 4px}.sbody{padding:14px}#who{display:none}.brand b{white-space:nowrap;font-size:14.5px}.appbar button.alt{white-space:nowrap}.chips{grid-template-columns:repeat(2,1fr);gap:8px}.chips>div{padding:10px 11px}.chips b{font-size:17px}main{padding:14px 10px 90px}section>details>*:not(summary){margin-left:14px;margin-right:14px}.brand small{display:none}}
</style>
</head>
<body>
<div id="loginBox" class="hide">
  <div class="login">
    <span class="logo">₹</span>
    <h1>Expense & Cash Tracker</h1>
    <p class="sub">Sign in to continue</p>
    <form id="loginForm">
      <label for="lEmail">Email</label>
      <input id="lEmail" type="email" autocomplete="username" required>
      <label for="lPass" style="margin-top:12px">Password</label>
      <input id="lPass" type="password" autocomplete="current-password" required>
      <div class="row"><button id="lBtn" type="submit">Sign in</button></div>
      <div id="loginErr" role="alert"></div>
    </form>
  </div>
</div>

<div id="app" class="hide">
<header class="appbar"><div class="in">
  <div class="brand"><span class="logo">₹</span><div><b>Expense & Cash Tracker</b><small>Personal finance</small></div></div>
  <div class="who"><span id="who"></span><button id="logout" class="alt">Sign out</button></div>
</div></header>
<div id="msg" role="status" aria-live="polite"></div>
<main>
<div class="dash">
  <div class="panel"><h2>Income</h2><div class="stats" id="incStats"></div></div>
  <div class="panel"><h2>Expense</h2><div class="stats" id="expStats"></div></div>
  <div class="panel"><h2>Cash</h2><div class="stats" id="cashStats"></div></div>
</div>

<section><details id="calcSec"><summary>Calculator</summary>
  <div class="calc"><input id="calcIn" inputmode="decimal" autocomplete="off" placeholder="e.g. 250*3+40">
    <div class="res" id="calcOut" aria-live="polite"></div><div class="keys" id="keys"></div>
    <div class="row"><button id="useCash" class="alt">Use in cash amount</button><button id="useExp" class="alt">Use in expense amount</button></div></div>
</details></section>

<section id="incSec">
  <div class="shead" id="incHead" role="button" tabindex="0" aria-expanded="false" aria-controls="incBody">Income</div>
  <div class="sbody hide" id="incBody">
  <h3>New income entry</h3>
  <div class="grid">
    <div><label for="iDate">Date</label><input type="date" id="iDate"></div>
    <div><label for="iSrc">Source</label><select id="iSrc"></select>
      <input id="iSrcNew" class="hide" placeholder="New source" style="margin-top:6px"><div class="tools" id="srcTools"></div></div>
    <div><label for="iDesc">Description</label><input id="iDesc"></div>
    <div><label for="iAmt">Amount</label><input type="number" id="iAmt" min="0" step="any"></div>
    <div><label for="iMode">Received by</label>
      <select id="iMode"><option>Cash</option><option>UPI app</option><option>Cheque</option></select></div>
  </div>
  <div class="row"><button id="saveInc">Save income</button><button id="cancelInc" class="alt hide">Cancel edit</button></div>
  <div class="wrap"><table id="incTbl"></table></div>
  <button id="moreInc" class="alt hide" style="margin-top:10px"></button>
</div>
</section>

<section id="expSec">
  <div class="shead" id="expHead" role="button" tabindex="0" aria-expanded="false" aria-controls="expBody">Expense</div>
  <div class="sbody hide" id="expBody">

  <h3>1 · New batch</h3>
  <div class="grid">
    <div><label for="bDate">Date</label><input type="date" id="bDate"></div>
    <div><label for="bNo">Batch no (auto)</label><input id="bNo" readonly></div>
    <div><label for="bAmt">Amount spent</label><input type="number" id="bAmt" min="0" step="any"></div>
    <div><label for="bPay">Payment mode</label><select id="bPay"><option>Cash</option><option>UPI app</option><option>Cheque</option></select></div>
  </div>
  <div class="row"><button id="saveBatch">Save batch</button></div>
  <div class="tot" id="dayHdr"></div>
  <div class="wrap"><table id="dayTbl"></table></div>

  <h3>2 · Batch details (add now or any time later)</h3>
  <div class="grid">
    <div><label for="fDate">Find batches by date (optional)</label><input type="date" id="fDate"></div>
    <div><label for="fNo">Filter by batch no (optional)</label><input id="fNo" list="bnoList" placeholder="e.g. 20261104-02" autocomplete="off"><datalist id="bnoList"></datalist></div>
    <div><label for="eBatch">Batch</label><select id="eBatch"></select></div>
    <div><label for="eSpent">Amount spent</label><input type="number" id="eSpent" min="0" step="any"></div>
    <div><label for="eMode">Payment mode</label><select id="eMode"><option value="">Not set</option><option>Cash</option><option>UPI app</option><option>Cheque</option></select></div>
    <div style="align-self:end;display:flex;gap:8px;flex-wrap:wrap"><button id="updAmt" class="alt">Update batch</button><button id="delBatch" class="alt" style="color:var(--err);border-color:var(--err)">Delete batch</button></div>
  </div>
  <div class="tot" id="batchSum"></div>
  <div class="wrap"><table id="expTbl"></table></div>
  <div class="grid" style="margin-top:12px">
    <div><label for="eCat">Category</label><select id="eCat"></select>
      <input id="eCatNew" class="hide" placeholder="New category" style="margin-top:6px"><div class="tools" id="catTools"></div></div>
    <div><label for="eItem">Item</label><select id="eItem"></select>
      <input id="eItemNew" class="hide" placeholder="New item" style="margin-top:6px"></div>
    <div><label for="eQty">Qty</label><input type="number" id="eQty" min="0" step="any" value="1"></div>
    <div><label for="eUnit">Unit</label><input id="eUnit" list="units" placeholder="kg, L, pcs"><datalist id="units"><option>kg</option><option>g</option><option>L</option><option>ml</option><option>pcs</option><option>dozen</option><option>packet</option><option>box</option></datalist></div>
    <div><label for="eAmt">Amount</label><input type="number" id="eAmt" min="0" step="any"></div>
  </div>
  <div class="row"><button id="saveExp">Add item to batch</button><button id="cancelExp" class="alt hide">Cancel edit</button></div>
  <h3>3 · Browse batches and their items</h3>
  <div class="grid">
    <div><label for="brMonth">Month</label><select id="brMonth"></select></div>
    <div><label for="brDate">Date</label><select id="brDate"></select></div>
    <div><label for="brNo">Batch no (optional)</label><input id="brNo" list="bnoList" placeholder="e.g. 20261104-02" autocomplete="off"></div>
  </div>
  <div class="tot" id="brSum"></div>
  <div id="browse"></div>
</div>
</section>

<section id="cashSec">
  <div class="shead" id="cashHead" role="button" tabindex="0" aria-expanded="false" aria-controls="cashBody">Cash</div>
  <div class="sbody hide" id="cashBody">
  <h3>New cash entry</h3>
  <div class="grid">
    <div><label for="kind">Cash type</label>
      <select id="kind"><option value="">Select…</option></select></div>
  </div>
  <div class="grid" id="cashFields" style="margin-top:12px"></div>
  <div id="denBox" class="hide" style="margin-top:14px"></div>
  <div class="row hide" id="cashBtn"><button id="addMore" class="alt hide">Add another</button><button id="cancelCash" class="alt hide">Cancel edit</button><button id="saveCash">Save cash entry</button></div>
  <div class="wrap"><table id="pendTbl"></table></div>
  <div class="wrap"><table id="cashTbl"></table></div>
  <button id="moreCash" class="alt hide" style="margin-top:10px"></button>
</div>
</section>
</main>
</div>

<script>
// Paste your project values here, or leave blank to be asked once (saved in this browser).
const SUPABASE_URL = '';
const SUPABASE_KEY = '';

const NEW = '__new__';
const url = SUPABASE_URL || localStorage.getItem('sb_url') || prompt('Supabase project URL');
const key = SUPABASE_KEY || localStorage.getItem('sb_key') || prompt('Supabase anon key');
if (url && key) { localStorage.setItem('sb_url', url); localStorage.setItem('sb_key', key); }
const db = supabase.createClient(url, key);

// One structure for every cash type: common fields + extra fields that go into the `details` JSON column.
const COMMON = [['entry_date','Date','date'],['description','Description','text'],['amount','Amount','number']];
const KINDS = {
  in_hand:  {label:'In Hand',   extra:[]},
  bank:     {label:'In Bank',   extra:[['bank_details','Bank details','text'],['account_no','Account no','text']]},
  bonds:    {label:'Bonds',     extra:[['bond_name','Bond name / issuer','text'],['bond_no','Bond / certificate no','text'],['interest_rate','Interest rate %','number'],['maturity_date','Maturity date','date']]},
  insurance:{label:'Insurance', extra:[['insurer','Insurer','text'],['policy_no','Policy no','text'],['maturity_date','Maturity date','date']]},
  deposits: {label:'Deposits',  extra:[['bank_details','Bank details','text'],['deposit_no','Deposit / account no','text'],['interest_rate','Interest rate %','number'],['maturity_date','Maturity date','date']]}
};

const $ = id => document.getElementById(id);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const say = (t, bad) => { const m = $('msg'); m.textContent = t; m.className = bad ? 'bad' : ''; clearTimeout(m.t); m.t = setTimeout(() => { m.textContent = ''; }, bad ? 9000 : 4500); };
const opt = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t ?? v; return o; };
const cell = (tr, t, cls) => { const c = tr.insertCell(); c.textContent = cls === 'n' && t !== '' && t != null && !isNaN(t) ? Number(t).toLocaleString('en-IN', {maximumFractionDigits: 3}) : (t ?? ''); if (cls) c.className = cls; return c; };

/* ---------- Shared helpers ---------- */

function renderStats(boxId, L, totalRows, catRows, extra = [], early = [], modeRows = null) {

  const sum = rows => rows.reduce((a, r) => a + Number(r.a || 0), 0);
  const group = (rows, key) => { const m = {}; rows.forEach(r => { const k = key(r); m[k] = (m[k] || 0) + Number(r.a || 0); }); return Object.entries(m); };
  const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; };

  const chips = el('div', null, 'chips');
  items.forEach(([k, v, note, cls]) => { const d = el('div', k, cls || ''); d.append(el('b', inr(v))); if (note) d.append(el('small', note)); chips.append(d); });
  box.append(chips);
  const tabs = el('div', null, 'tabs');

    const b = el('button', name, id === tab ? 'on' : ''); b.onclick = () => { statTab[boxId] = id; renderStats(boxId, L, totalRows, catRows, extra, early, modeRows); }; tabs.append(b);
  });

    const months = [...new Set(modeRows.map(r => (r.d || '').slice(0, 7)).filter(Boolean))].sort().reverse();
    mf = months.includes(statMonth[boxId]) ? statMonth[boxId] : '';

    sel.append(opt('', 'All months'), ...months.map(m => opt(m, mlabel(m))));

    box.append(sel);

  const list = tab === 'mode' ? group(mrows, r => r.m || 'Not set').sort((a, b) => b[1] - a[1])
    : tab === 'cat' ? group(catRows, r => r.c || '—').sort((a, b) => b[1] - a[1])
    : tab === 'month' ? group(totalRows, r => (r.d || '').slice(0, 7)).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 12)

    r.append(el('span', tab === 'month' ? new Date(k + '-01T00:00').toLocaleDateString('en-IN', {month: 'short', year: 'numeric'}) : k), i, el('b', inr(v)));
    box.append(r);

async function deleteBatch(b) {
  const n = expRows.filter(r => r.batch_no === b.batch_no).length;
  if (!confirm('Delete batch ' + b.batch_no + (n ? ' and its ' + n + ' item(s)?' : '?'))) return;
  let r = await db.from('expenses').delete().eq('batch_no', b.batch_no);
  if (r.error) return say('Could not delete items: ' + r.error.message, true);
  r = await db.from('expense_batches').delete().eq('batch_no', b.batch_no);
  if (r.error) return say('Could not delete batch: ' + r.error.message, true);
  say('Batch ' + b.batch_no + ' deleted.'); curBatch = '';
  await loadExpenses(); await loadBatches(); refreshNextNo();
}
$('delBatch').onclick = () => { const b = curB(); if (!b) return say('Pick a batch first.', true); deleteBatch(b); };
$('updAmt').onclick = async () => {
  const b = curB(), amt = parseFloat($('eSpent').value);
  if (!b || isNaN(amt)) return say('Pick a batch and enter the amount.', true);
  const {error} = await db.from('expense_batches').update({amount_spent: amt, payment_mode: $('eMode').value || null}).eq('batch_no', b.batch_no);
  if (error) return say('Could not update: ' + error.message, true);
  say('Batch updated.');
  loadBatches(b.batch_no);
};

function fillSelect(sel, values, addLabel, keep) {
  sel.innerHTML = '';
  values.forEach(v => sel.append(opt(v)));
  sel.append(opt(NEW, addLabel));
  if (keep && values.includes(keep)) sel.value = keep;
}
async function loadCategories(keep) {
  const {data, error} = await db.from('categories').select('name').order('name');
  if (error) return say('Could not load categories: ' + error.message, true);
  fillSelect($('eCat'), data.map(r => r.name), '➕ Add new category…', keep);
  syncCat();
}
function syncCat() {
  const isNew = $('eCat').value === NEW;
  $('eCatNew').classList.toggle('hide', !isNew); $('catTools').classList.toggle('hide', isNew);
  const list = isNew ? [] : (items[$('eCat').value] || []);
  fillSelect($('eItem'), list, '➕ Add new item…');
  if (!list.length) $('eItem').value = NEW;
  syncItem();
}
function syncItem() {
  $('eItemNew').classList.toggle('hide', $('eItem').value !== NEW);
  $('eUnit').value = lastUnit[$('eCat').value + '|' + $('eItem').value] || '';
}
$('eCat').onchange = syncCat;
$('eItem').onchange = syncItem;

function itemExtremes() {      // highest and least spend per item (category + item), over all entries
  const m = {};
  expRows.forEach(r => { const k = r.category + '|' + r.item; (m[k] ??= {c: r.category, i: r.item, a: 0, n: 0}); m[k].a += Number(r.amount || 0); m[k].n++; });
  const list = Object.values(m).sort((x, y) => y.a - x.a);
  if (!list.length) return [];
  const mk = (label, o, cls) => [label, o.a, o.i + ' (' + o.c + ') · ' + o.n + (o.n === 1 ? ' entry' : ' entries'), cls, o.i];
  const out = [mk('Highest expenditure item', list[0], 'hi')];
  if (list.length > 1) out.push(mk('Least expenditure item', list[list.length - 1], 'lo'));
  return out;
}
function drawExpStats() {
  renderStats('expStats', {total: 'Spent so far', cat: 'By category'},
    batchRows.map(b => ({d: b.batch_date, a: b.amount_spent})), expRows.map(r => ({c: r.category, a: r.amount})),
    itemExtremes(), [], batchRows.map(b => ({d: b.batch_date, m: b.payment_mode, a: b.amount_spent})));
}
async function loadBatches(keep) {
  const res = await fetchAll('expense_batches');
  if (res.error) return say('Could not load batches: ' + res.error.message, true);
  batchRows = res.data.sort((a, b) => b.batch_date.localeCompare(a.batch_date) || b.batch_no.localeCompare(a.batch_no));
  $('bnoList').replaceChildren(...batchRows.map(b => opt(b.batch_no)));
  fillBatchSelect(keep); drawExpStats(); drawCashStats(); renderDayBatches(); renderBrowse();
}
async function loadExpenses() {
  const res = await fetchAll('expenses');
  if (res.error) return say('Could not load expenses: ' + res.error.message, true);
  expRows = res.data.sort(byDateDesc);
  const count = {}; lastUnit = {};
  expRows.forEach(r => {
    (count[r.category] ??= {})[r.item] = (count[r.category][r.item] || 0) + 1;
    const k = r.category + '|' + r.item; if (r.unit && !(k in lastUnit)) lastUnit[k] = r.unit;
  });
  items = {};
  for (const c in count) items[c] = Object.keys(count[c]).sort((a, b) => count[c][b] - count[c][a]);
  syncCat(); showBatchSum(); renderItems(); drawExpStats(); drawCashStats(); renderDayBatches(); renderBrowse();
}
function renderItems() {
  const t = $('expTbl'); t.innerHTML = '';
  const rows = expRows.filter(r => r.batch_no === curBatch);
  if (!rows.length) return;
  t.createTHead().insertRow().innerHTML = '<th>Category</th><th>Item</th><th class="n">Qty</th><th>Unit</th><th class="n">Amount</th><th></th>';
  for (const r of rows) {
    const tr = t.insertRow();
    cell(tr, r.category); cell(tr, r.item); cell(tr, r.qty, 'n'); cell(tr, r.unit); cell(tr, r.amount, 'n');
    actBtns(tr, () => startEditExp(r), async () => {
      if (confirm('Delete this item?')) { await db.from('expenses').delete().eq('id', r.id); if (editExpId === r.id) endEditExp(); loadExpenses(); }
    });
  }
}
let editExpId = null;
function startEditExp(r) {
  editExpId = r.id;
  setSel('eCat', 'eCatNew', r.category); syncCat();
  setSel('eItem', 'eItemNew', r.item); syncItem();
  $('eUnit').value = r.unit || ''; $('eQty').value = r.qty; $('eAmt').value = r.amount;
  $('saveExp').textContent = 'Update item'; $('cancelExp').classList.remove('hide');
  $('eCat').scrollIntoView({behavior: 'smooth', block: 'center'});
}
function endEditExp() {
  editExpId = null; $('saveExp').textContent = 'Add item to batch'; $('cancelExp').classList.add('hide');
  $('eAmt').value = ''; $('eQty').value = 1; $('eCatNew').value = ''; $('eItemNew').value = '';
}
$('saveExp').onclick = async () => {
  const b = curB();
  if (!b) return say('Save a batch first, then pick it to add items.', true);
  const isNewCat = $('eCat').value === NEW;
  const cat = isNewCat ? $('eCatNew').value.trim() : $('eCat').value;
  const item = $('eItem').value === NEW ? $('eItemNew').value.trim() : $('eItem').value;
  const row = {entry_date: b.batch_date, batch_no: b.batch_no, category: cat, item, qty: parseFloat($('eQty').value),
               unit: $('eUnit').value.trim() || null, amount: parseFloat($('eAmt').value)};
  if (!cat || !item || isNaN(row.qty) || isNaN(row.amount)) return say('Fill in category, item, qty and amount.', true);
  if (isNewCat) {
    const r = await db.from('categories').upsert({name: cat}, {onConflict: 'name'});
    if (r.error) return say('Could not save category: ' + r.error.message, true);
  }
  const {error} = editExpId !== null ? await db.from('expenses').update(row).eq('id', editExpId) : await db.from('expenses').insert(row);
  if (error) return say('Could not save: ' + error.message, true);
  say(editExpId !== null ? 'Item updated.' : 'Item added to ' + b.batch_no + '.');
  endEditExp();
  await loadCategories(cat);
  await loadExpenses();
};

/* ---------- Income ---------- */
async function loadSources(keep) {
  const {data, error} = await db.from('income_sources').select('name').order('name');
  if (error) return say('Could not load income sources: ' + error.message, true);
  fillSelect($('iSrc'), data.map(r => r.name), '➕ Add new source…', keep);
  syncSrc();
}
function syncSrc() { const n = $('iSrc').value === NEW; $('iSrcNew').classList.toggle('hide', !n); $('srcTools').classList.toggle('hide', n); }
$('iSrc').onchange = syncSrc;
let editIncId = null;
function startEditInc(r) {
  editIncId = r.id; $('iDate').value = r.entry_date; setSel('iSrc', 'iSrcNew', r.source); syncSrc();
  $('iDesc').value = r.description || ''; $('iAmt').value = r.amount; $('iMode').value = r.received_mode;
  $('saveInc').textContent = 'Update income'; $('cancelInc').classList.remove('hide');
  $('incSec').scrollIntoView({behavior: 'smooth'});
}
function endEditInc() {
  editIncId = null; $('saveInc').textContent = 'Save income'; $('cancelInc').classList.add('hide');
  $('iAmt').value = ''; $('iDesc').value = ''; $('iSrcNew').value = '';
}
async function loadIncome() {
  const res = await fetchAll('incomes'), t = $('incTbl'); t.innerHTML = '';
  if (res.error) return say('Could not load income: ' + res.error.message, true);
  const all = res.data.sort(byDateDesc), data = showAll.inc ? all : all.slice(0, 15);
  $('moreInc').classList.toggle('hide', all.length <= 15); $('moreInc').textContent = showAll.inc ? 'Show latest 15' : 'Show all (' + all.length + ')';
  incRows = all; drawCashStats();
  renderStats('incStats', {total: 'Received so far', cat: 'By source'}, all.map(r => ({d: r.entry_date, a: r.amount})), all.map(r => ({c: r.source, a: r.amount})));
  if (!data.length) return;
  t.createTHead().insertRow().innerHTML = '<th>Date</th><th>Source</th><th>Description</th><th class="n">Amount</th><th>Received by</th><th></th>';
  for (const r of data) {
    const tr = t.insertRow();
    cell(tr, r.entry_date); cell(tr, r.source); cell(tr, r.description); cell(tr, r.amount, 'n'); cell(tr, r.received_mode);
    actBtns(tr, () => startEditInc(r), async () => {
      if (confirm('Delete this income entry?')) { await db.from('incomes').delete().eq('id', r.id); if (editIncId === r.id) endEditInc(); loadIncome(); }
    });
  }
}
$('saveInc').onclick = async () => {
  const isNew = $('iSrc').value === NEW;
  const src = isNew ? $('iSrcNew').value.trim() : $('iSrc').value;
  const row = {entry_date: $('iDate').value, source: src, description: $('iDesc').value.trim(),
               amount: parseFloat($('iAmt').value), received_mode: $('iMode').value};
  if (!row.entry_date || !src || isNaN(row.amount)) return say('Fill in date, source and amount.', true);
  if (isNew) {
    const r = await db.from('income_sources').upsert({name: src}, {onConflict: 'name'});
    if (r.error) return say('Could not save source: ' + r.error.message, true);
  }
  const {error} = editIncId !== null ? await db.from('incomes').update(row).eq('id', editIncId) : await db.from('incomes').insert(row);
  if (error) return say('Could not save: ' + error.message, true);
  say(editIncId !== null ? 'Income updated.' : 'Income saved.');
  endEditInc();
  await loadSources(src); loadIncome();
};

/* ---------- Calculator ---------- */
function evalExpr(src) {
  const s = src.replace(/\s/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  const t = s.match(/\d*\.?\d+|[-+*\/()%]/g) || [];
  if (!s || t.join('') !== s) throw 0;
  let i = 0;
  const post = v => { while (t[i] === '%') { i++; v /= 100; } return v; };
  const prim = () => {
    const x = t[i++];
    if (x === '(') { const v = add(); if (t[i++] !== ')') throw 0; return post(v); }
    if (x === '-') return -prim();
    if (x === '+') return prim();
    if (x === undefined || isNaN(x)) throw 0;
    return post(+x);
  };
  const mul = () => { let v = prim(); while (t[i] === '*' || t[i] === '/') { const o = t[i++], r = prim(); v = o === '*' ? v * r : v / r; } return v; };
  const add = () => { let v = mul(); while (t[i] === '+' || t[i] === '-') { const o = t[i++], r = mul(); v = o === '+' ? v + r : v - r; } return v; };
  const v = add();
  if (i < t.length || !isFinite(v)) throw 0;
  return Math.round(v * 1e10) / 1e10;
}
const cIn = $('calcIn'), cOut = $('calcOut');
function preview() { try { cOut.textContent = '= ' + evalExpr(cIn.value); } catch { cOut.textContent = cIn.value ? '…' : ''; } }
function equals() { try { cIn.value = evalExpr(cIn.value); cOut.textContent = ''; } catch { cOut.textContent = 'Check the expression'; } }
[['C','⌫','(',')'],['7','8','9','÷'],['4','5','6','×'],['1','2','3','−'],['0','.','%','+']].flat().forEach(k => {
  const b = document.createElement('button'); b.textContent = k;
  b.onclick = () => { if (k === 'C') cIn.value = ''; else if (k === '⌫') cIn.value = cIn.value.slice(0, -1); else cIn.value += k; preview(); cIn.focus(); };
  $('keys').append(b);
});
const eq = document.createElement('button'); eq.textContent = '='; eq.className = 'eq'; eq.onclick = equals; $('keys').append(eq);
cIn.oninput = preview;
cIn.onkeydown = e => { if (e.key === 'Enter') equals(); };
function useResult(id, what) {
  const el = $(id);
  if (!el) return say('Choose a cash type first.', true);
  try { el.value = evalExpr(cIn.value); say('Result put in the ' + what + ' amount.'); } catch { say('Calculate a valid number first.', true); }
}
$('useCash').onclick = () => useResult('c_amount', 'cash');
$('useExp').onclick = () => useResult('eAmt', 'expense');

$('bDate').onchange = () => { refreshNextNo(); renderDayBatches(); }; $('eBatch').onchange = syncBatch; $('fDate').onchange = () => fillBatchSelect(); $('fNo').oninput = () => fillBatchSelect(); $('brNo').oninput = renderBrowse;
$('cancelExp').onclick = endEditExp; $('cancelInc').onclick = endEditInc; $('cancelCash').onclick = endEditCash;
$('moreCash').onclick = () => { showAll.cash = !showAll.cash; loadCash(); };
$('moreInc').onclick = () => { showAll.inc = !showAll.inc; loadIncome(); };
nameTools('eCat', 'catTools', 'categories', 'expenses', 'category', 'category', async k => { await loadCategories(k); await loadExpenses(); });
nameTools('iSrc', 'srcTools', 'income_sources', 'incomes', 'source', 'source', k => { loadSources(k); loadIncome(); });

/* ---------- Section toggles (collapsed by default; stats stay visible) ---------- */
['exp', 'inc', 'cash'].forEach(k => {
  const head = $(k + 'Head'), body = $(k + 'Body');
  const toggle = () => { const open = !body.classList.toggle('hide'); head.setAttribute('aria-expanded', open); head.parentElement.classList.toggle('open', open); };
  head.onclick = toggle;
  head.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
});

/* ---------- Login ---------- */
let started = false;
function loadAll() {
  $('bDate').value = today(); $('iDate').value = today(); refreshNextNo();
  loadCategories().then(loadExpenses); loadBatches(); loadSources(); loadIncome(); loadCash();
}
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginErr').textContent = ''; $('lBtn').disabled = true;
  const {error} = await db.auth.signInWithPassword({email: $('lEmail').value.trim(), password: $('lPass').value});
  $('lBtn').disabled = false;
  if (error) $('loginErr').textContent = error.message;
};
$('logout').onclick = () => db.auth.signOut();
db.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {      // deferred: supabase-js advises against awaiting its calls inside this callback
    if (session) {
      $('who').textContent = session.user.email || '';
      if (!started) { started = true; $('loginBox').classList.add('hide'); $('app').classList.remove('hide'); $('lPass').value = ''; loadAll(); }
    } else {
      started = false; $('app').classList.add('hide'); $('loginBox').classList.remove('hide');
      batchRows = []; expRows = []; cashRows = []; incRows = []; $('msg').textContent = '';
    }
  }, 0);
});
</script>
